[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "idc-singlecell"
version = "0.1.0"
description = "Identification of Disease-associated Cells using within-donor covariance contrasts"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Fengge Chang"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "scipy>=1.11", "pandas>=1.5", "scikit-learn>=1.2", "anndata>=0.9", "threadpoolctl>=3", "PyYAML>=6"]

[project.urls]
Repository = "https://github.com/cfg824157947/IDC"

[project.optional-dependencies]
test = ["pytest>=7"]
gpu = ["torch>=2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
